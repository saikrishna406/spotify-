<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify – Web Player: Music for everyone</title>
  <meta name="description" content="A high-fidelity Spotify Web Player replica built with clean audio state machine, queue management, live frequency visualizer, and responsive controls.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231ED760'%3E%3Cpath d='M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.498 17.304c-.218.357-.682.47-1.039.252-2.85-1.741-6.438-2.135-10.665-1.168-.409.093-.815-.164-.908-.573-.093-.409.164-.815.573-.908 4.63-1.058 8.601-.607 11.787 1.348.357.218.47.682.252 1.051zm1.468-3.265c-.275.448-.863.593-1.311.318-3.262-2.005-8.235-2.587-12.094-1.415-.506.153-1.043-.134-1.196-.64-.153-.506.134-1.043.64-1.196 4.414-1.339 9.896-.689 13.643 1.622.448.275.593.863.318 1.311zm.126-3.41c-3.911-2.322-10.354-2.535-14.088-1.401-.6.182-1.237-.158-1.419-.758-.182-.6.158-1.237.758-1.419 4.296-1.304 11.418-1.052 15.932 1.628.539.319.716 1.018.397 1.557-.319.539-1.018.716-1.557.397z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="spotify-theme">
  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Main Application Wrapper -->
  <div class="app-layout" id="app-layout">
    
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="main-sidebar" aria-label="Main Navigation">
      <div class="sidebar-top">
        <a href="#" class="brand-logo" id="brand-logo" aria-label="Spotify Home">
          <svg class="spotify-icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.498 17.304c-.218.357-.682.47-1.039.252-2.85-1.741-6.438-2.135-10.665-1.168-.409.093-.815-.164-.908-.573-.093-.409.164-.815.573-.908 4.63-1.058 8.601-.607 11.787 1.348.357.218.47.682.252 1.051zm1.468-3.265c-.275.448-.863.593-1.311.318-3.262-2.005-8.235-2.587-12.094-1.415-.506.153-1.043-.134-1.196-.64-.153-.506.134-1.043.64-1.196 4.414-1.339 9.896-.689 13.643 1.622.448.275.593.863.318 1.311zm.126-3.41c-3.911-2.322-10.354-2.535-14.088-1.401-.6.182-1.237-.158-1.419-.758-.182-.6.158-1.237.758-1.419 4.296-1.304 11.418-1.052 15.932 1.628.539.319.716 1.018.397 1.557-.319.539-1.018.716-1.557.397z"/>
          </svg>
          <span class="brand-name">Spotify</span>
        </a>

        <nav class="nav-menu" aria-label="Primary Navigation">
          <button class="nav-item active" id="nav-home" data-view="home">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h4.5v-6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 0 1 3 0l7.5 4.33A2 2 0 0 1 22 7.577V21a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-5h-3v5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.577a2 2 0 0 1 1-1.732l7.5-4.33z"/>
            </svg>
            <span>Home</span>
          </button>
          <button class="nav-item" id="nav-search" data-view="search">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M10.533 1.278a9.255 9.255 0 1 0 5.86 16.425l5.58 5.58a.75.75 0 1 0 1.06-1.06l-5.58-5.58a9.255 9.255 0 0 0-6.92-15.365zm-7.755 9.255a7.755 7.755 0 1 1 15.51 0 7.755 7.755 0 0 1-15.51 0z"/>
            </svg>
            <span>Search</span>
          </button>
        </nav>
      </div>

      <!-- YOUR LIBRARY SECTION -->
      <div class="library-panel" id="library-panel">
        <div class="library-header">
          <button class="library-title-btn" id="library-collapse-toggle">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1zM15.5 2.134A1 1 0 0 0 14 3v18a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1.5-.866zM16 20V4h4v16h-4zM7.5 4.134A1 1 0 0 0 6 5v14a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1V5a1 1 0 0 0-1.5-.866zM8 18V6h2v12H8z"/>
            </svg>
            <span class="lib-label">Your Library</span>
          </button>
          <div class="library-actions">
            <button class="icon-btn-subtle" id="create-playlist-btn" title="Create playlist" aria-label="Create playlist">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M11 11V3h2v8h8v2h-8v8h-2v-8H3v-2h8z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Library Filter Tags -->
        <div class="filter-pills" id="filter-pills">
          <button class="pill active" data-filter="all">All</button>
          <button class="pill" data-filter="playlist">Playlists</button>
          <button class="pill" data-filter="artist">Artists</button>
        </div>

        <!-- Scrollable Playlists / Saved Items -->
        <div class="library-list" id="library-items-list" role="list">
          <!-- Populated by JS -->
        </div>
      </div>
    </aside>

    <!-- CENTER MAIN VIEW -->
    <main class="main-content" id="main-content">
      <!-- TOP STICKY BAR -->
      <header class="top-nav" id="top-nav">
        <div class="nav-history-controls">
          <button class="history-btn disabled" id="history-back" aria-label="Go back">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M15.957 2.793a1 1 0 0 1 0 1.414L8.164 12l7.793 7.793a1 1 0 1 1-1.414 1.414L5.336 12l9.207-9.207a1 1 0 0 1 1.414 0z"/></svg>
          </button>
          <button class="history-btn disabled" id="history-forward" aria-label="Go forward">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8.043 2.793a1 1 0 0 0 0 1.414L15.836 12l-7.793 7.793a1 1 0 1 0 1.414 1.414L18.664 12 9.457 2.793a1 1 0 0 0-1.414 0z"/></svg>
          </button>
        </div>

        <!-- Search Bar (shown when Search is active or always available) -->
        <div class="search-bar-container" id="search-bar-container">
          <svg class="search-glass" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M10.533 1.278a9.255 9.255 0 1 0 5.86 16.425l5.58 5.58a.75.75 0 1 0 1.06-1.06l-5.58-5.58a9.255 9.255 0 0 0-6.92-15.365zm-7.755 9.255a7.755 7.755 0 1 1 15.51 0 7.755 7.755 0 0 1-15.51 0z"/>
          </svg>
          <input type="search" id="global-search-input" placeholder="What do you want to play?" autocomplete="off" spellcheck="false">
          <button class="search-clear-btn hidden" id="search-clear-btn" aria-label="Clear search">✕</button>
        </div>

        <div class="top-nav-actions">
          <button class="pill-btn-premium" id="btn-demo-mode">✨ Clean-Room Engine</button>
          <button class="user-profile-badge" id="user-profile-btn" aria-label="User Account">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=80&q=80" alt="Avatar" class="avatar-img">
            <span class="user-name">Developer</span>
          </button>
        </div>
      </header>

      <!-- DYNAMIC ROUTE CONTAINER -->
      <div class="view-viewport" id="view-viewport">
        <!-- Rendered by JavaScript: Home View, Playlist View, Search View -->
      </div>
    </main>

    <!-- RIGHT DRAWER: NOW PLAYING & QUEUE -->
    <aside class="right-drawer hidden" id="right-drawer" aria-label="Secondary details">
      <div class="drawer-header">
        <div class="drawer-tabs">
          <button class="drawer-tab-btn active" id="tab-queue" data-tab="queue">Queue</button>
          <button class="drawer-tab-btn" id="tab-now-playing" data-tab="nowplaying">Now Playing</button>
          <button class="drawer-tab-btn" id="tab-lyrics" data-tab="lyrics">Lyrics</button>
        </div>
        <button class="icon-btn-subtle" id="close-drawer-btn" aria-label="Close drawer">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
        </button>
      </div>

      <div class="drawer-body" id="drawer-body">
        <!-- Queue View, Now Playing View, or Lyrics View -->
      </div>
    </aside>

  </div>

  <!-- BOTTOM PERSISTENT AUDIO PLAYER BAR -->
  <footer class="player-bar" id="player-bar" aria-label="Music player bar">
    
    <!-- LEFT: Current Track Info -->
    <div class="player-left">
      <div class="track-artwork-wrap" id="player-art-wrap">
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=120&q=80" alt="Album Cover" class="player-art" id="player-track-art">
        <button class="art-expand-btn" id="art-expand-btn" title="Expand cover">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
      </div>
      <div class="track-meta">
        <div class="track-title-row">
          <span class="track-title" id="player-track-title">Midnight City Lights</span>
          <span class="explicit-tag" id="player-explicit-tag">E</span>
        </div>
        <span class="track-artist" id="player-track-artist">Neon Horizon</span>
      </div>
      <button class="heart-btn" id="player-heart-btn" aria-label="Save to your Liked Songs" title="Save to your Liked Songs">
        <svg class="heart-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </button>
      <!-- Real-time Visualizer Canvas -->
      <canvas class="player-visualizer-canvas" id="player-visualizer" width="70" height="24" title="Live Audio Spectrum"></canvas>
    </div>

    <!-- CENTER: Playback Controls & Progress Bar -->
    <div class="player-center">
      <div class="playback-controls">
        <button class="control-btn" id="btn-shuffle" title="Enable shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M13.151 4.793a1 1 0 0 1 1.414 0l4.243 4.243a1 1 0 0 1-1.414 1.414l-2.4-2.4V11a5 5 0 0 1-5 5H6a1 1 0 1 1 0-2h4a3 3 0 0 0 3-3V8.05l-2.4 2.4a1 1 0 1 1-1.414-1.414l3.965-4.243zm-7.151 7.207a1 1 0 0 1 1 1v.005a3 3 0 0 0 2.22 2.9A4.98 4.98 0 0 1 10 17H6a1 1 0 1 1 0-2h4a2.986 2.986 0 0 0 1.25-.274A4.984 4.984 0 0 1 9.07 13.01 5.006 5.006 0 0 1 6 13v-.005a1 1 0 0 1-1-1zm12.566 2.207a1 1 0 0 1 1.414 1.414l-4.243 4.243a1 1 0 0 1-1.414 0l-3.965-4.243a1 1 0 0 1 1.414-1.414l2.4 2.4V13a5 5 0 0 1 1.25-3.274 4.984 4.984 0 0 1 2.18 1.716A3 3 0 0 0 15 13v3.55l2.4-2.4z"/>
          </svg>
          <span class="active-dot"></span>
        </button>

        <button class="control-btn" id="btn-prev" title="Previous track" aria-label="Previous">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M6 3h2v18H6V3zm3.5 9L21 4v16L9.5 12z"/>
          </svg>
        </button>

        <button class="control-btn play-pause-btn" id="btn-play-pause" title="Play" aria-label="Play">
          <svg class="play-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M8 5.14v14l11-7-11-7z"/>
          </svg>
          <svg class="pause-icon hidden" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <button class="control-btn" id="btn-next" title="Next track" aria-label="Next">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M16 3h2v18h-2V3zM4 20L15.5 12 4 4v16z"/>
          </svg>
        </button>

        <button class="control-btn" id="btn-repeat" title="Enable repeat" aria-label="Repeat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
          <span class="repeat-one-badge hidden">1</span>
          <span class="active-dot"></span>
        </button>
      </div>

      <!-- Scrubber Timeline -->
      <div class="timeline-container">
        <span class="time-label" id="current-time">0:00</span>
        <div class="progress-bar-wrapper" id="progress-bar-wrap" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
            <div class="progress-thumb" id="progress-thumb"></div>
          </div>
        </div>
        <span class="time-label" id="total-duration">3:30</span>
      </div>
    </div>

    <!-- RIGHT: Secondary Utility Controls -->
    <div class="player-right">
      <button class="utility-btn" id="btn-lyrics-toggle" title="Lyrics" aria-label="Lyrics">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </button>

      <button class="utility-btn" id="btn-queue-toggle" title="Queue" aria-label="Queue">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/>
        </svg>
      </button>

      <button class="utility-btn" id="btn-device-toggle" title="Connect to a device" aria-label="Connect to a device">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M4 6h16v10H4V6zm18-2H2a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7v2H7v2h10v-2h-2v-2h7a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
        </svg>
      </button>

      <!-- Volume Bar -->
      <div class="volume-control-wrap">
        <button class="utility-btn" id="btn-volume-icon" title="Mute/Unmute" aria-label="Mute">
          <svg class="vol-high" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg class="vol-muted hidden" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
        <div class="volume-slider-bg" id="volume-slider-wrap" role="slider" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
          <div class="volume-slider-fill" id="volume-slider-fill" style="width: 75%;"></div>
          <div class="volume-thumb" id="volume-thumb"></div>
        </div>
      </div>

      <button class="utility-btn" id="btn-fullscreen-toggle" title="Full screen" aria-label="Full screen">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>
    </div>

  </footer>

  <!-- Hidden Native Audio Engine -->
  <audio id="native-audio" preload="metadata" crossorigin="anonymous"></audio>

  <!-- Device Selection Modal -->
  <div class="modal-backdrop hidden" id="device-modal" role="dialog" aria-modal="true" aria-labelledby="device-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="device-modal-title">Connect to a device</h3>
        <button class="icon-btn-subtle" id="close-modal-btn">✕</button>
      </div>
      <div class="device-list" id="device-list">
        <div class="device-item active">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M4 6h16v10H4V6zm18-2H2a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7v2H7v2h10v-2h-2v-2h7a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
          <div class="device-meta">
            <span class="device-name">This Web Browser (Active)</span>
            <span class="device-type">Web Audio API · 24-bit 48kHz</span>
          </div>
          <span class="device-status-dot"></span>
        </div>
        <div class="device-item disabled">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
          <div class="device-meta">
            <span class="device-name">Mobile Phone (Spotify Connect)</span>
            <span class="device-type">Nearby device</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
